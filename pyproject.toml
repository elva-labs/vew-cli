[project]
name = "vew-cli"
version = "0.1.0"
description = "Virtual Engineering Workbench — command-line client acting as the signed-in user"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1,<9",
    "httpx>=0.27,<1",
    "pyyaml>=6.0.1,<7",
]

[project.scripts]
vew = "vew_cli.main:cli"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vew_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Same style rules as the backend's pre-commit hooks (flake8: --max-line-length 120 --max-complexity 8).
[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["vew_cli", "tests"]

